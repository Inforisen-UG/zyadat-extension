<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duplicate Provider Selector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Duplicate Selector</h1>
      <p class="subtitle">Check duplicate provider IDs, keep one per ID</p>
    </header>

    <section class="status" id="page-status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Checking page…</span>
    </section>

    <section class="field">
      <label>Keep unchecked</label>
      <div class="radio-group">
        <label class="radio">
          <input type="radio" name="keep" value="first" checked />
          First row (topmost)
        </label>
        <label class="radio">
          <input type="radio" name="keep" value="last" />
          Last row (bottommost)
        </label>
      </div>
    </section>

    <section class="field">
      <label for="scroll-delay">Scroll delay (ms)</label>
      <input
        type="number"
        id="scroll-delay"
        min="10"
        max="200"
        value="20"
      />
      <p class="hint">Increase if rows are missed</p>
    </section>

    <div class="actions">
      <button id="run-btn" class="btn primary" disabled>Run</button>
      <button id="cancel-btn" class="btn secondary" disabled>Cancel</button>
    </div>

    <section class="log" id="log" hidden>
      <div id="log-message"></div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <pre id="log-details"></pre>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
